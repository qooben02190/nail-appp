<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--bg:#faf7f5;--card:#fff;--text:#2b2326;--muted:#8a7f83;--line:#ece4e1;--accent:#c96f86;--accent-soft:#f7e3e8}
@media (prefers-color-scheme:dark){:root{--bg:#1c1719;--card:#262022;--text:#f2ecee;--muted:#a3989c;--line:#3a3134;--accent:#e08aa0;--accent-soft:#4a2f37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 0;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 6px}
.tabs{display:flex}
.tab{flex:1;border:0;background:none;padding:10px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;font-family:inherit}
.tab.active{color:var(--accent);border-color:var(--accent);font-weight:600}
main{padding:16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input,textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit}
input,textarea{display:block;max-width:100%;min-width:0}
/* iPhone 的日期欄會自帶最小寬度而超出畫面，這裡統一外觀與高度 */
input[type=date]{-webkit-appearance:none;appearance:none;height:44px;line-height:22px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.field{margin-bottom:14px}.field:last-child{margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:8px 14px;font-size:15px;font-family:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.add{border-style:dashed;color:var(--muted)}
.suggest{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.sug{text-align:left;border:1px solid var(--line);background:var(--accent-soft);color:var(--text);border-radius:10px;padding:8px 12px;font-size:14px;font-family:inherit}
.sug small{color:var(--muted)}
.submit{width:100%;padding:14px;font-size:17px;font-weight:600;border:0;border-radius:12px;background:var(--accent);color:#fff;font-family:inherit}
.submit:disabled{opacity:.5}
.rec .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.rec .sub{color:var(--muted);font-weight:400;font-size:13px}
.rec .meta{color:var(--muted);font-size:13px;margin-top:4px}
.rec .note{font-size:14px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.hidden{display:none}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:17px}
.btn2{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;font-family:inherit}
.monthnav .btn2{font-size:18px;padding:4px 16px}
.stats2{display:flex;gap:12px}.stats2>.card{flex:1;min-width:0}
.stat .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
#st-total{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:24px}
</style>
</head>
<body>
<header>
  <h1>美甲消費紀錄</h1>
  <div class="tabs">
    <button class="tab active" data-tab="form">新增紀錄</button>
    <button class="tab" data-tab="recent">最近紀錄</button>
    <button class="tab" data-tab="stats">月統計</button>
  </div>
</header>

<main>
  <section id="view-form">
    <div class="card">
      <div class="field"><label class="lbl" for="date">日期</label><input type="date" id="date"></div>
      <div class="field">
        <label class="lbl" for="name">客人姓名 *</label>
        <input id="name" autocomplete="off" placeholder="輸入姓名可找舊客">
        <div id="suggest" class="suggest"></div>
      </div>
    </div>

    <div class="card">
      <div class="field"><span class="lbl">項目（可複選，長按可刪除）</span><div class="chips" id="chips-items">載入中…</div></div>
      <div class="field"><span class="lbl">款式（可複選，長按可刪除）</span><div class="chips" id="chips-styles"></div></div>
    </div>

    <div class="card">
      <div class="field"><label class="lbl" for="amount">金額 *</label><input type="number" id="amount" inputmode="numeric" min="0" placeholder="0"></div>
      <div class="field"><span class="lbl">付款方式</span><div class="chips" id="chips-payment"></div></div>
      <div class="field"><label class="lbl" for="note">備註</label><textarea id="note" rows="3"></textarea></div>
    </div>

    <button class="submit" id="submit">儲存紀錄</button>
  </section>

  <section id="view-recent" class="hidden"><div id="recent"></div></section>

  <section id="view-stats" class="hidden">
    <div class="monthnav">
      <button type="button" class="btn2" id="prev-month" aria-label="上個月">‹</button>
      <strong id="month-label"></strong>
      <button type="button" class="btn2" id="next-month" aria-label="下個月">›</button>
    </div>
    <div class="card stat"><div class="lbl">總金額</div><div class="big" id="st-total">$0</div></div>
    <div class="stats2">
      <div class="card stat"><div class="lbl">人次</div><div class="big" id="st-count">0</div></div>
      <div class="card stat"><div class="lbl">客單價平均</div><div class="big" id="st-avg">$0</div></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const TYPES = { items: '項目', styles: '款式', payment: '付款方式' };
const MULTI = { items: true, styles: true, payment: false };
const state = { options: {}, customers: [], recent: [], monthly: {}, month: '', sel: { items: new Set(), styles: new Set(), payment: new Set() } };
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 2200);
}
function call(fn, ...args) {
  return new Promise((resolve, reject) =>
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
}

function applyData(d) {
  state.options = d.options;
  state.customers = d.customers;
  state.recent = d.recent;
  state.monthly = d.monthly || {};
  if (!state.month) state.month = d.today.slice(0, 7);
  if (!$('date').value) $('date').value = d.today;
  Object.keys(TYPES).forEach(renderChips);
  renderRecent();
  renderStats();
}

/* 月統計 */
function renderStats() {
  const [y, m] = state.month.split('-').map(Number);
  const s = state.monthly[state.month] || { total: 0, count: 0 };
  const avg = s.count ? Math.round(s.total / s.count) : 0;
  $('month-label').textContent = y + ' 年 ' + m + ' 月';
  $('st-total').textContent = '$' + s.total.toLocaleString();
  $('st-count').textContent = s.count.toLocaleString();
  $('st-avg').textContent = '$' + avg.toLocaleString();
}
function shiftMonth(n) {
  const [y, m] = state.month.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  state.month = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  renderStats();
}
$('prev-month').onclick = () => shiftMonth(-1);
$('next-month').onclick = () => shiftMonth(1);

/* 選單 chips */
function renderChips(key) {
  const box = $('chips-' + key);
  const sel = state.sel[key];
  const list = state.options[TYPES[key]] || [];
  box.innerHTML = list.map(v =>
    `<button type="button" class="chip${sel.has(v) ? ' on' : ''}" data-v="${esc(v)}">${esc(v)}</button>`
  ).join('') + '<button type="button" class="chip add">＋ 新增</button>';
  box.querySelector('.chip.add').onclick = () => addOption(key);
  box.querySelectorAll('.chip:not(.add)').forEach(b => {
    // 短按 = 選取；長按 0.6 秒 = 刪除選項
    let timer = null, longPressed = false;
    const start = () => {
      longPressed = false;
      clearTimeout(timer);
      timer = setTimeout(() => { longPressed = true; removeOption(key, b.dataset.v); }, 600);
    };
    const cancel = () => clearTimeout(timer);
    b.addEventListener('pointerdown', start);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, cancel));
    b.addEventListener('contextmenu', e => e.preventDefault());
    b.onclick = () => {
      if (longPressed) { longPressed = false; return; }
      toggle(key, b.dataset.v);
    };
  });
}
async function removeOption(key, v) {
  if (!confirm('要從選單刪除「' + v + '」嗎？\n已存的紀錄不會受影響。')) return;
  try {
    state.options = await call('removeOption', TYPES[key], v);
    state.sel[key].delete(v);
    renderChips(key);
    toast('已刪除「' + v + '」');
  } catch (e) {
    toast('刪除失敗：' + e.message);
  }
}
function toggle(key, v) {
  const sel = state.sel[key];
  if (MULTI[key]) {
    sel.has(v) ? sel.delete(v) : sel.add(v);
  } else {
    const had = sel.has(v);
    sel.clear();
    if (!had) sel.add(v);
  }
  renderChips(key);
}
async function addOption(key) {
  const v = (prompt('新增' + TYPES[key]) || '').trim();
  if (!v) return;
  try {
    state.options = await call('addOption', TYPES[key], v);
    if (!MULTI[key]) state.sel[key].clear();
    state.sel[key].add(v);
    renderChips(key);
    toast('已新增「' + v + '」');
  } catch (e) {
    toast('新增失敗：' + e.message);
  }
}

/* 舊客建議 */
function renderSuggest() {
  const box = $('suggest');
  const q = $('name').value.trim().toLowerCase();
  if (!q) { box.innerHTML = ''; return; }
  const m = state.customers
    .filter(c => c.name.toLowerCase().includes(q) && c.name !== $('name').value.trim())
    .slice(0, 5);
  box.innerHTML = m.map((c, i) =>
    `<button type="button" class="sug" data-i="${i}">${esc(c.name)}<br>` +
    `<small>來店 ${c.count} 次 · 最近 ${esc(c.last)} · 累計 $${c.total.toLocaleString()}</small></button>`
  ).join('');
  box.querySelectorAll('.sug').forEach(b => {
    b.onclick = () => {
      const c = m[b.dataset.i];
      $('name').value = c.name;
      box.innerHTML = '';
    };
  });
}
$('name').addEventListener('input', renderSuggest);

/* 最近紀錄 */
function renderRecent() {
  const box = $('recent');
  if (!state.recent.length) { box.innerHTML = '<div class="empty">還沒有紀錄</div>'; return; }
  box.innerHTML = state.recent.map(r => `
    <div class="card rec">
      <div class="top">
        <span>${esc(r.name)}</span>
        <span>$${Number(r.amount || 0).toLocaleString()}</span>
      </div>
      <div class="meta">${esc(r.date)} · ${esc(r.payment || '未填付款方式')}</div>
      <div class="meta">${esc([r.items, r.styles].filter(Boolean).join(' ／ '))}</div>
      ${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}
    </div>`).join('');
}

/* 儲存 */
$('submit').onclick = async () => {
  const rec = {
    date: $('date').value,
    name: $('name').value.trim(),
    items: [...state.sel.items],
    styles: [...state.sel.styles],
    amount: $('amount').value,
    payment: [...state.sel.payment][0] || '',
    note: $('note').value.trim()
  };
  if (!rec.date) return toast('請選日期');
  if (!rec.name) return toast('請填客人姓名');
  if (rec.amount === '' || Number(rec.amount) < 0) return toast('請填金額');

  const btn = $('submit');
  btn.disabled = true;
  btn.textContent = '儲存中…';
  try {
    applyData(await call('saveRecord', rec));
    resetForm();
    toast('已儲存');
  } catch (e) {
    toast('儲存失敗：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '儲存紀錄';
  }
};
function resetForm() {
  ['name', 'amount', 'note'].forEach(id => $(id).value = '');
  Object.values(state.sel).forEach(s => s.clear());
  Object.keys(TYPES).forEach(renderChips);
  $('suggest').innerHTML = '';
  window.scrollTo(0, 0);
}

/* 分頁 */
function showTab(name) {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === name));
  $('view-form').classList.toggle('hidden', name !== 'form');
  $('view-recent').classList.toggle('hidden', name !== 'recent');
  $('view-stats').classList.toggle('hidden', name !== 'stats');
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tab').forEach(t => { t.onclick = () => showTab(t.dataset.tab); });

call('getInitData').then(applyData).catch(e => toast('載入失敗：' + e.message));
</script>
</body>
</html>
